<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブログを投稿する</title>
    <link rel="stylesheet" href="/css/style.css">

</head>

<body>
    <div th:replace="~{fragment/title :: header}"></div>

    <div class="form-container">
        <h1>ブログを投稿する</h1>

        <form action="/post"  method="post">

            <div class="form-group">
                <label for="title">タイトル</label>
                <input type="text" id="title" name="title" placeholder="記事のタイトルを入力してください" required />

                <label class="required-label">作者名</label>
                <input type="text" id="author" name="author" placeholder="作者名" class="input-author" required><br>

                <label for="content">本文</label>
                <textarea id="content" name="content" placeholder="ここに本文を入力してください" required></textarea>
            </div>

            <button type="submit" class="submit-btn">投稿する</button>
        </form>
    </div>
</body>

</html>

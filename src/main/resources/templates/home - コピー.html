<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記事一覧</title>
    <link rel="stylesheet" href="/css/style.css">

</head>

<body>
    <div th:replace=" ~{fragment/title :: header}"></div>

    <h1>ホーム</h1>

    <div class="main">

        <div class="block" th:each="blog : ${blogs}">
            <a th:href="@{/blog/{id}(id=${blog.id})}">
                <div class="text-content">
                    <h2 class="title" th:text="${blog.title}">記事一覧</h2>

                    <p class="author" th:text="${blog.author}">作者</p>
                </div>
            </a>
        </div>
    </div>

</body>

</html>
